.preview{font-size:13px;color:var(--muted);margin:2px 0 10px;min-height:22px}

.keypad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:340px;margin:12px 0}
.key{background:#fff;border:1px solid #b9cbb7;border-radius:12px;min-height:54px;font-size:21px;font-weight:700;color:var(--ink)}
.key:hover:not(:disabled){background:#eef4ea}

.key-wide{grid-column:span 2}
.keypad-toggle{margin:4px 0 10px}
.hint{display:block}

.hint-step p{margin:4px 0}
.hint-step.explain{border-left-color:#8fb08f}
.hint-tag{font-size:11px;font-weight:700;color:#8a6322;letter-spacing:.04em}
.hint-step.explain .hint-tag{color:var(--green)}
.retry-note{font-size:13px;background:#eef3fb;border:1px solid #d4e0f1;border-radius:11px;padding:11px 15px;color:#3b5570}
.feedback-actions{margin-top:15px;gap:10px}
.kind-summary{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:6px 0 4px}
.kind-summary strong{font-size:16px;color:var(--ink);margin-left:4px}
.size-pick{display:flex;align-items:center;gap:8px;margin:20px 0 6px}
.size-btn{border:1px solid var(--line);background:#fff;border-radius:30px;padding:7px 18px;font-size:13px;font-weight:700;color:var(--muted);min-height:40px}
.size-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}

.text-button.small{font-size:12px}

.record-table table{min-width:620px}

.rv-list li{display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding:8px 0;border-bottom:1px solid #eef1ec}

.link-inline{background:none;border:0;padding:0;font:inherit;color:#2f6d57;text-decoration:underline;cursor:pointer}

   science, grade 5, A(1) 物の溶け方.
   Two differences from mathematics, both handled in the data rather than in the engine:

     in `accept`; kanji readings cannot be derived, so they have to be written out
   - a 類題 cannot be made by changing a number, so each one is a hand-written sibling that
     asks the same idea from another angle. `sib` groups a question with its sibling. */

/* Teaching-time weights are not set for science: the two annual teaching plans used for the
   mathematics weights (section 12) cover mathematics only, so a science weight would be a
   guess. With weight 0 the engine treats every science unit as equal, which is honest until
   a real source is in hand. */
function su(id,group,title,subtitle,code,points,example,steps,caution){
 /* The diagram is looked up by the unit's own id, so a unit gets its figure by having one drawn. */
 units.push({id,subject:'science',group,title,subtitle,code,weight:0,points,example,steps,caution,visual:id});
}

 questions.push({id:`s5-${unit}-${n}`,unit,level,kind,sib,text,answer:String(answer),accept,hint,think,steps,options:null,suffix,visual:null,check:null});
}

/* ---------- 3択をやめ、書いて答える形にする ----------

   覚えているかではなく自分で答えを出せるかを問う形になるので、問題としても良くなる。
   答えが言葉のものは kind:'word' にして、ひらがな・漢字などの書き方のゆれを accept で受ける。 */
const typedAnswers={
 'm5-place-4':a=>{const m=a.match(/^1\/(\d+)の位$/);if(!m)return [];const n=m[1];
  const ord={'10':'第一位','100':'第二位','1000':'第三位'}[n];

 'm5-multiply-2':a=>({'小さくなる':['ちいさくなる','小さくなります','ちいさくなります'],

 makers[id]=r=>{const v=g(r);if(!v)return null;v.options=null;v.kind='word';v.accept=(typedAnswers[id])(v.answer);return v;};
}
/* 「どれが正しいか」を問う2問は、選択肢がないと問いが成り立たない。
   選択肢を3つから5つに増やして、当たる確率を3分の1から5分の1に下げる。 */
for(const [id,extra] of [['m5-congruent-5',['二つの角とその間の辺','三つの辺の長さだけ']],
 ['m5-proportion-2',['人の身長と年れい','正三角形の1辺と面積']]]){
 const q=questions.find(x=>x.id===id);
 if(q&&q.options)q.options=[...q.options,...extra];
}

   and sentence structure — where the answer is a short word the child has to produce.

   convert it, so the question would be answering itself. */

/* ---- 類題の対づけ ----
   手書きの類題（IDが b で終わるもの）に、相手の問題のIDを pairOf として持たせる。
   エンジンはこれを「算数の自動生成類題」と同じものとして扱うので、進み具合・復習・
   「理解の確認」マーク・単元の達成判定はすべてそのまま動く。

   pairOf を持つ問題は、ふだんの出題には出てこない。元の問題を自力で解いたあとに
   「類題を解く」で初めて出る。理由は、対の77%が相手の答えを問題文や解説に含んでおり
   （実測）、同じ回に並べると「理解が移った」という証拠にならないため。 */
/* 社会の類題は、番号で対にする（c5-land-2 と c5-land-2b）。
   理科とちがい、社会の類題は「同じ考えを別の数で確かめる」ものにはならない。
   事実そのものは移らないので、対は「同じ単元の同じ観点を、別の角度から問う」ものにとどまる。
   したがって社会の「理解の確認」マークは、算数・理科より弱い証拠である。これは仕様である。 */
for(const q of questions){
 if(!q.id.startsWith('c5-'))continue;
 const m=q.id.match(/^c5-([a-z]+)-(\d+)b?$/);
 if(m)q.sib=m[1]+'-'+m[2];
}

   出題済みの sib をすべて確認したうえで新しい sib を立てている。 */

   端末内の声がないときに「あるもの」で代用すると、サーバー側の声になり通信が起きる。
   英語はPCに端末内の声がないことがあり、黙って通信してしまうので、代用はしない。 */
function pickVoice(lang){const want=String(lang||'').slice(0,2).toLowerCase();
 const v=voicesNow().filter(x=>String(x.lang||'').slice(0,2).toLowerCase()===want);
 return v.find(x=>x.localService)||null;}
function hasLocalVoice(lang){return !!pickVoice(lang);}
/* 声の一覧はあとから読みこまれる端末があるので、「声が0だから無理」とは決めつけない。
   いったん話させてみて、始まらなければそのときに伝える。押して無反応、をつくらないため。
   読み上げ中は同じボタンが「とめる」に変わる。止め方が分からない、を防ぐため。 */
/* 読み上げ用に、記号を日本語に直す。画面の表示は変えない。
   読み上げエンジンが記号をどう読むかは端末まかせで、こちらでは確かめようがない。
   推測にたよらず、読ませる前に言葉にしておく。
   分数は日本語の語順（3/4 → 4ぶんの3）。単位は長いものから先に直す（km² を km より先に）。 */
const speechUnits=[['km3','りっぽうキロメートル'],['km2','へいほうキロメートル'],
 ['cm3','りっぽうセンチメートル'],['cm2','へいほうセンチメートル'],
 ['m3','りっぽうメートル'],['m2','へいほうメートル'],
 ['km','キロメートル'],['cm','センチメートル'],['mm','ミリメートル'],
 ['dL','デシリットル'],['mL','ミリリットル'],['kg','キログラム'],['ha','ヘクタール'],
 ['L','リットル'],['g','グラム'],['t','トン'],['m','メートル']];
function forSpeech(src){
 let t=String(src||'');
 t=t.replace(/[³]/g,'3').replace(/[²]/g,'2');
 // 分数がさき（□をさきに直すと「しかく/12」が残る）
 t=t.replace(/([\d.]+|□|何|[a-zA-Z])\s*\/\s*([\d.]+|□|何|[a-zA-Z])/g,
  (m,a,b)=>{const f=x=>x==='□'?'しかく':x;return `${f(b)}ぶんの${f(a)}`;});
 t=t.replace(/□/g,'しかく');
 t=t.replace(/↔/g,' と ');
 for(const [u,word] of speechUnits){
  t=t.replace(new RegExp('(?<![A-Za-z])'+u+'(?![A-Za-z])','g'),word);
 }
 t=t.replace(/[%％]/g,'パーセント');
 t=t.replace(/\s*×\s*/g,' かける ');
 t=t.replace(/\s*÷\s*/g,' わる ');
 t=t.replace(/\s*[＝=]\s*/g,' イコール ');
 t=t.replace(/\s*[−–—]\s*/g,' ひく ');
 t=t.replace(/\s*[〜～]\s*/g,' から ');
 t=t.replace(/°/g,'ど');
 return t;}
let sayingKey=null;
function setSayLabel(key,speaking){
 try{
  const b=document.querySelector(`[data-action="speak"][data-id="${key}"]`);
  if(!b)return;
  const base=b.dataset.label||'よみあげ';
  b.innerHTML=speaking?'<span aria-hidden="true">■</span> とめる':'<span aria-hidden="true">🔊</span> '+e(base);
  b.classList.toggle('speaking',!!speaking);
 }catch(err){}}
function clearSayLabels(){
 try{for(const b of document.querySelectorAll('[data-action="speak"]'))setSayLabel(b.dataset.id,false);}catch(e){}}
function speak(text,lang,key){
 if(!speechReady()){toast('このたんまつでは よみあげが つかえないみたい。');return;}
 const voice=pickVoice(lang||'ja-JP');
 if(!voice&&voicesNow().length){toast('このたんまつには、その言葉の よみあげの声が 入っていないみたい。');return;}
 try{
  speechSynthesis.cancel();clearSayLabels();
  /* 端末の中の声は抑揚が平坦なので、文の切れ目で分けて読ませ、間をつくる。
     通信を起こさない範囲でできる工夫。社長の判断で、声は端末内のものを使う（A案）。 */
  const parts=forSpeech(text).split(/(?<=[。？！])/).map(x=>x.trim()).filter(Boolean);
  const chunks=parts.length?parts:[forSpeech(text)];
  let started=false,finished=0;
  const done=()=>{sayingKey=null;setSayLabel(key,false);};
  chunks.forEach((chunk,i)=>{
   const u=new SpeechSynthesisUtterance(chunk);
   u.lang=lang||'ja-JP';u.rate=0.95;u.pitch=1;
   if(voice)u.voice=voice;
   u.onstart=()=>{if(!started){started=true;sayingKey=key;setSayLabel(key,true);}};
   u.onend=()=>{started=true;finished++;if(finished>=chunks.length)done();};
   u.onerror=()=>{if(!started)toast('このたんまつでは よみあげが つかえないみたい。');started=true;finished++;if(finished>=chunks.length)done();};
   speechSynthesis.speak(u);
  });
  setTimeout(()=>{if(!started){toast('このたんまつでは よみあげが つかえないみたい。');done();}},1500);
 }catch(e){toast('よみあげが うまくいかなかった。');sayingKey=null;setSayLabel(key,false);}}
function stopSpeaking(){try{if(speechReady())speechSynthesis.cancel();}catch(e){}sayingKey=null;clearSayLabels();}

function recommended(){const prev=unitFor(M.state.lastUnit);

 +`<section class="card"><span class="pill">STEP 01 · 学ぶ</span><h2 style="margin-top:14px">考え方のポイント</h2><ol class="lesson-points">${u.points.map(p=>`<li>${rb(e(p))}</li>`).join('')}</ol>${(sayables.lesson={text:u.points.join('　'),lang:'ja-JP'})&&sayButton('lesson','よみあげ')}${visual(u.visual)}<div class="example"><span class="pill">例題</span><h3 style="margin-top:12px">${rb(e(u.example))}</h3>`

function readable(v){const s=M.normal(v).replace(/\s*と\s*/g,' ').replace(/\s*\/\s*/g,'/');let m=s.match(/^([+-]?\d+) (\d+)\/(\d+)$/);if(m)return `${m[1]}と${m[3]}分の${m[2]}`;m=s.match(/^([+-]?\d+)\/(\d+)$/);if(m)return `${m[2]}分の${m[1]}`;return '';}
function previewInner(draft){const read=readable(draft),shown=M.normal(draft);return shown?`いまの答え：<strong>${e(shown)}</strong>${read?`（${e(read)}）`:''}`:'&nbsp;';}
function previewHtml(draft){return `<p class="preview" id="answer-preview" aria-live="polite">${previewInner(draft)}</p>`;}

 return `<div class="keypad" role="group" aria-label="数字キー">${KEYPAD.map(([label,key])=>`<button type="button" class="key ${key==='clear'?'key-wide':''} ${['back','clear'].includes(key)?'key-edit':''}" data-action="key" data-id="${e(key)}" aria-label="${key==='back'?'1文字消す':key==='clear'?'ぜんぶ消す':key==='と'?'帯分数の と':key}">${e(label)}</button>`).join('')}</div><div class="keypad-toggle">${button('数字キーを隠す','keypad-off','','text-button small')}</div>`;}
function hintBlock(q,level){if(!level)return '';const parts=[];if(level>=1)parts.push(`<div class="hint-step"><span class="hint-tag">ヒント1 · 着眼点</span><p>${rb(e(q.hint))}</p></div>`);
 if(level>=2)parts.push(`<div class="hint-step"><span class="hint-tag">ヒント2 · 途中の考え方</span><p>${rb(e(M.hintText(q,2)))}</p></div>`);
 if(level>=3)parts.push(`<div class="hint-step explain"><span class="hint-tag">解き方</span><ol class="steps">${q.steps.map(t=>`<li>${rb(e(t))}</li>`).join('')}</ol><p class="muted small">解き方を読んでから正解した問題は、あとで類題でもう一度確かめます。</p></div>`);
 return `<div id="hint-box" class="hint">${parts.join('')}</div>`;}
 /* The place the child answers: three choices, or a box to type a number into with the keypad under it. */
 function answerArea(q,s,locked,feedback,r){
  return q.options?`<div class="choices" role="group" aria-label="答えを一つ選ぶ">${s.order.map((o,i)=>`<button class="choice ${s.draft===o?'selected':''} ${feedback&&o===q.answer?'correct':''} ${feedback&&s.draft===o&&!r.ok?'incorrect':''}" data-action="choose" data-id="${i}" aria-pressed="${s.draft===o}" ${locked?'disabled':''}><span class="letter" aria-hidden="true">${String.fromCharCode(65+i)}</span><span>${e(o)}</span></button>`).join('')}</div>`:(()=>{
  /* A question whose answer is a word needs the ordinary keyboard: a numeric inputmode would
     bring up the number pad on a phone, where kana cannot be typed at all, and the digit
     keypad and the number read-back below the box are both meaningless for a word. */
  const word=q.kind==='word';
  return `<label class="answer-label" for="answer">あなたの答え</label><div class="answer-entry"><input id="answer" type="text" ${word?'inputmode="text"':'inputmode="decimal"'} enterkeyhint="done" autocomplete="off" spellcheck="false" maxlength="${word?24:40}" value="${e(s.draft)}" aria-describedby="answer-help answer-error" ${locked?'disabled':''}>${q.suffix?`<span class="unit-suffix">${e(q.suffix)}</span>`:''}</div>${word?'':previewHtml(s.draft)}${word||locked?'':keypadHtml()}<details class="input-help-wrap"><summary>書き方のきまり</summary><p class="input-help" id="answer-help">${word?'文ではなく、ことばだけを書きます。ひらがなでも漢字でもかまいません。':'単位は入力せず、数だけを書きます。分数は3/4、帯分数は1と1/2（1 1/2）。全角数字も使えます。'}</p></details>`;
 })();
 }

 const mode=s.mode==='test'?'たしかめテスト':s.mode==='review'?'ふくしゅう':'練習',locked=feedback;
 const hintLabel=level===0?'ヒントを見る（答えは出ません）':level===1?'もう少しヒント':'解き方を見る';
 const kind=r?M.kindOf(r):null,again=r?r.again:null;
 const basic=feedback&&!r.ok?M.basicFor():null,canVariant=feedback&&M.hasVariant(q.base||q.id);

 +`<h1 class="question-text">${rb(e(q.text))}</h1>${q.noSpeak?'':(sayables.q={text:q.text,lang:'ja-JP'})&&sayButton('q','もんだいを よむ')}${visual(q.visual)}${retrying?'<p class="retry-note">解き方を読んだあとの、もう一度の挑戦です。この回答は「解説のあとの正解」として記録します。</p>':''}${answerArea(q,s,locked,feedback,r)}<p id="answer-error" class="error" role="alert"></p>${feedback?`<div id="feedback" class="feedback ${r.ok||again?.ok?'':'wrong'}" role="status">${feedbackBuddy(r,again,kind,s)}<h2>${headline}</h2><p class="answer">答え：${e(q.answer)}${q.suffix?` ${e(q.suffix)}`:''}</p><ol class="steps">${q.steps.map(t=>`<li>${rb(e(t))}</li>`).join('')}</ol>${again?`<p class="muted small">1回目の答え：${e(r.answer)} / もう一度の答え：${e(again.answer)}</p>`:''}</div><div class="feedback-actions row">${!r.ok&&!again?button('もう一度、自分で解く','retry','','btn secondary small'):''}${canVariant?button('数字をかえた類題を解く','variant','','btn secondary small'):''}${basic?button('基礎の1問にもどる','basic-step','','btn secondary small'):''}${button('例題を見直す','lesson',q.unit,'text-button small')}</div>`:''}${!feedback&&s.mode!=='test'?`${level<3?`<button class="text-button" data-action="hint" aria-expanded="${level>0}" aria-controls="hint-box">${hintLabel}</button>`:''}${hintBlock(q,level)}`:''}`
 
 +`<details class="scratch"><summary>考え方をメモする（採点の対象外）</summary><label class="visually-hidden" for="note">考え方のメモ</label><textarea id="note" maxlength="2000" placeholder="式や、考えたことを書いてみよう。" ${locked?'disabled':''}>${e(s.note)}</textarea></details><div class="quiz-actions row">${button(feedback?(s.cursor+1===s.ids.length?'結果を見る':'次の問題へ →'):(s.mode==='test'?'回答して次へ →':retrying?'もう一度、答えを確かめる':'答えを確かめる'),feedback?'next':'submit')}</div></section>`

 <div class="callout">ミッションは、そこの問題をそのまま使います。新しいしるしがもらえる仕組みではありません。まちがえても、何度でもやり直せます。ミッションがあるのは、すべてのところにあります。</div>`;}
function mapState(info){
 return info.mastered?['しっかり身についた','done2']:info.complete?['ぜんぶできた','done1']:info.done>0?[`${info.done} / ${info.total}問`,'going']:['まだ','todo'];}
function adventure(){
 const a=M.achievements(),open=M.outfitsOpen(),set=M.state.settings,line=buddyLines(a,set.companion);
 render(`<div class="eyebrow">すすんだ ところ</div><h1>${subjectNow().name}のぼうけん</h1>
 <p class="muted">${M.units.length}の場所は、どこからでも行ける。やった場所に色がつくよ。</p>
 <div class="row" style="margin:0 0 18px">${button('ずかんを見る →','dex')}</div>
 <section class="card buddy-card">
  <div class="buddy-box">${companionSvg(set.companion,set.outfit,120)}</div>
  <div class="buddy-talk"><p>${e(line.main)}</p>${line.sub?`<p class="buddy-sub">${e(line.sub)}</p>`:''}<p class="muted small buddy-trait">${e(line.trait)}</p>
   <div class="row"><span class="muted small">あいぼう</span>${M.companions.map(c=>`<button class="chip ${set.companion===c.id?'active':''}" data-action="buddy" data-id="${c.id}" aria-pressed="${set.companion===c.id}">${c.name}</button>`).join('')}</div>
   <div class="row"><span class="muted small">かざり</span>${open.filter(o=>o.open).map(o=>`<button class="chip ${set.outfit===o.id?'active':''}" data-action="outfit" data-id="${o.id}" aria-pressed="${set.outfit===o.id}">${o.name}</button>`).join('')}</div>
   ${(()=>{
     /* 鍵のかかったかざりを全部並べると、電話の画面2つ分になった（実測951px）。
        つぎの2つだけ見せて、残りは数だけ言う。何が待っているかは分かり、画面は短く保てる。 */
     const locked=open.filter(o=>!o.open);
     if(!locked.length)return '<p class="muted small next-outfit">かざりは、ぜんぶそろったよ。</p>';
     const show=locked.slice(0,2),rest=locked.length-show.length;
     return `<div class="row next-outfit">${show.map(o=>`<span class="chip locked">${o.name}（${o.progress.what==='units'?`ぜんぶできたところ ${o.progress.have}/${o.progress.want}`:`しるし ${o.progress.have}/${o.progress.want}`}）</span>`).join('')}${rest?`<span class="muted small">ほかに ${rest}こ</span>`:''}</div>`;})()}
  </div>
 </section>
 ${missionList()}
 <div class="section-head"><h2>${M.units.length}の場所</h2></div>
 <ol class="journey">${M.units.map((u,i)=>{const info=a.units[u.id],[label,cls]=mapState(info),g=groupFor(u);
  return `<li class="place ${cls}"><span class="place-dot" aria-hidden="true">${info.complete?'★':i+1}</span>
   <button class="card place-card" data-action="lesson" data-id="${u.id}" aria-label="${e(u.title)} ${label}">
    <div class="between"><span class="unit-icon small" style="background:${g.color}" aria-hidden="true">${g.icon}</span><span class="muted small">${label}</span></div>
    <h3>${rb(e(u.title))}</h3><p class="muted small">${u.subtitle}</p></button></li>`;}).join('')}</ol>
 <div class="callout">場所は順番に開く仕組みではありません。学校で習ったところから取り組めます。かざりは、しるしの数で増えます。しるしは1問につき1回だけなので、同じところをくりかえしても増えません。</div>`,'adventure');}
function dexSlot(m,title){
 const kind=m.checked?' slot-checked':m.done?' slot-done':'';
 const label=m.checked?'ちがう数でもできた':m.done?'自分でできた':'まだ';
 return `<span class="slot${kind}" role="img" aria-label="${e(title)} ${label}"></span>`;}
function dex(){
 const a=M.achievements();
 const nothing=a.totals.done===0&&a.totals.checked===0;
 render(`<div class="eyebrow">あつめた しるし</div><h1>ずかん</h1>
 <p class="muted">ヒントなしで解けたら「●」。数をかえた問題でも解けたら「◎」。</p>
 <div class="stats"><div class="stat"><span>じぶんでできた</span><strong>${a.totals.done}<small>/ ${a.totals.possibleDone}</small></strong></div>
 <div class="stat"><span>ちがう数でもできた</span><strong>${a.totals.checked}<small>/ ${a.totals.possibleChecked}</small></strong></div>
 <div class="stat"><span>ぜんぶできたところ</span><strong>${Object.values(a.units).filter(u=>u.complete).length}<small>/ ${M.units.length}</small></strong></div></div>
 ${nothing?`<section class="card empty"><div class="dex-slots empty-demo" aria-hidden="true">${'<span class="slot slot-demo"></span>'.repeat(5)}</div><h2>まだ しるしはありません</h2><p class="muted">ヒントを見ても大丈夫。あとでもう一度、自分で解けたときに「●」がつきます。</p>${button('ところをえらぶ','units')}</section>`:''}
 <div class="dex-grid">${M.units.map(u=>{
  const info=a.units[u.id],qs=M.questions.filter(q=>q.unit===u.id),g=groupFor(u);
  const badge=info.mastered?'<span class="pill">しっかり身についた</span>':info.complete?'<span class="pill">ぜんぶできた</span>':'';
  return `<button class="card dex-unit" data-action="lesson" data-id="${u.id}" aria-label="${e(u.title)} じぶんでできた${info.done}問、ちがう数でもできた${info.checked}問">
   <div class="between"><span class="unit-icon small" style="background:${g.color}" aria-hidden="true">${g.icon}</span>${badge}</div>
   <h3>${rb(e(u.title))}</h3>
   <div class="dex-slots" aria-hidden="true">${qs.map(q=>dexSlot(a.marks.get(q.id),q.text)).join('')}</div>
   <p class="muted small">じぶんで ${info.done}/${info.total}<br>ちがう数で ${info.checked}/${qs.filter(q=>a.marks.get(q.id).canCheck).length}</p></button>`;}).join('')}</div>
 <div class="callout">しるしは、1つの問題につき1回だけつきます。同じところを何回くりかえしても増えません。ヒントを使って正解した問題や、解き方を読んだあとに正解した問題には、まだつきません。あとで自分で解けたときにつきます。</div>`,'dex');}
function about(){render(
  
  `<div class="panel">${button('← ホームへ','home','','text-button back')}<div class="eyebrow">保護者の方へ</div><h1>このアプリについて</h1><section class="card"><h2>小さく試して、改善するための版です</h2><p>小学5年生の算数18単元・理科7単元・社会7単元・国語7単元を、説明・例題・練習・確認テスト・復習の流れで学べます。算数は学校の授業で時間をかける単元は7問、それ以外は5問、合計106問。理科・社会・国語は各単元5問の合計35問ずつに、同じ考え方を別の題材で問う類題を1問ずつ用意しています。算数の問題数の根拠は教科書2社の年間指導計画の配当時数で、学校のテストに出る順ではありません。理科・社会・国語には配当時数の出典がないため、単元ごとに同じ問題数にしています。</p>`
 +`<p>学習指導要領を基準に範囲を整理していますが、授業や教科書のすべてを置きかえるものではありません。実際のお子さんによる利用と、教材内容の第三者レビューはこれからです。</p><h3 style="margin-top:23px">できること</h3><ul><li>単元ごとの説明・例題を読む</li><li>数値・分数を画面の数字キーで入力し、入力した内容を確かめる</li><li>ヒントを3段階（着眼点 → 途中の考え方 → 解き方）で見る</li>`
 +`<li>習った単元と難しさを選んで確認テストを受ける</li><li>間違えた問題を復習し、数字をかえた類題で確かめる</li><li>自力での正解・ヒントを使った正解・解き方を読んだあとの正解を、分けて記録する</li><li>1回3問または5問の短い区切りで取り組み、途中で終える</li><li>途中の学習を同じブラウザで再開する</li></ul><h3>対象外・今後確かめること</h3><ul>`
 +`<li>作図や筆算の過程、自由記述の自動評価</li><li>学校ごとのテスト日・試験問題・授業進度への自動対応</li><li>中学受験の専門対策</li><li>端末間同期や複数人の記録の分離</li><li>成績向上や単元の完全な習得の保証</li><li>算数で数値を変えた類題があるのは106問中96問（残り10問は、数値を持たない定義・性質の問題）。理科・社会・国語は数値を変えられないため、35問すべてに別題材の類題を1問ずつ手で用意しています</li><li>3問・5問という区切りは試験的な設定で、学習効果が確かめられた値ではありません</li></ul>`
 
 +`<p class="muted">数値は単位を付けずに入力します。同じ大きさの分数や小数も正解として扱います。確認テストも収録済みの問題から出題するため、繰り返すと同じ問題が出ます。</p></section><div class="section-head"><h2>収録範囲</h2></div><div class="coverage">${M.groups.map(g=>`<section class="card"><h3>${g.name}</h3><ul>${M.units.filter(u=>u.group===g.id).map(u=>`<li>${u.title}</li>`).join('')}</ul></section>`).join('')}</div>`
 +`<div class="callout">学習記録は、この端末のこのブラウザに保存します。氏名・メールアドレスの入力や、アプリから学習記録を送信する機能はありません。別の人と同じブラウザで使うと、記録は共通になります。</div><p class="muted">文部科学省の小学校学習指導要領を範囲整理の基準としています（算数は<a href="${MathContent.source}" target="_blank" rel="noopener">解説 算数編</a>）。理科・社会も同要領の各教科の内容にそろえています。文部科学省・学校・教科書会社による監修や公認を受けたアプリではありません。</p></div>`
 );}
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-action]');if(!b||b.disabled)return;const id=b.dataset.id,act=b.dataset.action;
 const actions={
  home,
  units:()=>unitsPage(),
  parent:()=>parentReview(),
  // Switching subject only changes which units are listed; every record is kept.
  subject:()=>{if(M.setSetting('subject',id)){groupFilter='all';
   // 教科の切り替えは単元一覧から行うのがふつうだが、ふくしゅう画面からも切り替えられる
   if(route==='review')reviewPage();else unitsPage('all');}},
  filter:()=>unitsPage(id),
  lesson:()=>lesson(id),
  practice:()=>practice(id),
  'unit-test':()=>unitTest(id),
  resume:quizPage,
  choose:()=>choose(id),
  submit:submitAnswer,
  next:()=>{const done=M.next();if(done)resultPage();else quizPage();},
  hint:()=>{M.showHint();quizPage();},
  key:()=>keyPress(id),
  'keypad-on':()=>{M.setSetting('keypad',true);quizPage();},
  'keypad-off':()=>{M.setSetting('keypad',false);quizPage();},
  size:()=>{M.setSetting('size',Number(id));lesson(openUnit||M.state.lastUnit);},
  retry:()=>{if(M.retry())quizPage();},
  variant:()=>{const made=M.insertVariant();if(made){if(M.next())resultPage();else quizPage();toast('数字をかえた類題を追加しました');}else toast('この問題の類題は、まだ用意できていません');},
  'basic-step':()=>{const q=M.basicFor();if(q&&M.insertNext(q.id)){if(M.next())resultPage();else quizPage();toast('基礎の1問をはさみました');}else toast('この単元の基礎の問題は、すでに今回に入っています');},
  'end-early':()=>dialog('ここで終えますか？','答えた問題の記録は残ります。まだ答えていない問題は記録しません。','ここで終える',()=>{const out=M.endEarly();if(out==='done')resultPage();else home();}),
  test:testPage,
  review:reviewPage,
  records,
  dex,
  adventure,
  about,
  'one-question':()=>launch([id],'practice','1問練習'),
  'review-one':()=>launch([id],'review','1問の復習'),
  'review-all':()=>{const n=M.state.settings.size,ids=M.shuffled(M.wrong()).map(q=>q.id).slice(0,n);launch(ids,'review',`復習${ids.length}問`);},
  'result-review':()=>launch(M.shuffled((M.state.lastResult?.responses||[]).filter(r=>!r.ok)).map(r=>r.id),'review','今回間違えた問題の復習'),
  'last-result':resultPage,
  'parent-records':()=>parentRecords(),
  speak:id=>{if(speechReady()&&(speechSynthesis.speaking||speechSynthesis.pending)){stopSpeaking();return;}const t=sayables[id];if(t)speak(t.text,t.lang,id);},
  'export-json':()=>saveRecords('json'),
  'export-csv':()=>saveRecords('csv'),
  mission:()=>{if(M.beginMission(id))quizPage();else toast('このミッションはいま始められません');},
  buddy:()=>{M.setSetting('companion',id);adventure();},
  outfit:()=>{if(M.setSetting('outfit',id))adventure();},
  'select-all':()=>{testUnits=new Set(M.units.map(u=>u.id));document.querySelectorAll('[name="test-unit"]').forEach(c=>c.checked=true);updateTestSummary();},
  'select-none':()=>{testUnits.clear();document.querySelectorAll('[name="test-unit"]').forEach(c=>c.checked=false);updateTestSummary();},
  'start-test':()=>{const qs=M.prepared(testCandidates(),Math.min(testCandidates().length,testCount),true);launch(qs.map(q=>q.id),'test',`${testUnits.size===1?M.units.find(u=>testUnits.has(u.id)).title:'選んだ単元'}の確認テスト`);},
  reset:()=>dialog('この端末の記録を消しますか？','回答・考え方のメモ・途中の学習が消えます。元には戻せません。先にバックアップを保存しておくと、あとで戻せます。前の全教科試作版の記録は残ります。','記録を消す',()=>{M.reset();parentRecords();toast(M.storageOk?'この端末の記録をリセットしました':'記録は画面内でリセットしました。保存はできていません。');}),
  'close-dialog':closeDialog,
  'confirm-dialog':()=>{const fn=dialogAction;closeDialog();fn?.();}
 };
 actions[act]?.(id);
});
document.addEventListener('input',ev=>{if(ev.target.id==='answer'){M.setDraft(ev.target.value);refreshAnswerView();}if(ev.target.id==='note'){M.setNote(ev.target.value);storageStatus();}});
document.addEventListener('change',ev=>{
 if(ev.target.id==='import-file'){const file=ev.target.files&&ev.target.files[0];ev.target.value='';
  if(!file)return;const reader=new FileReader();
  reader.onload=()=>{const out=M.importData(reader.result);records();toast(out.error?out.error:`${out.added}件を読みこみました（同じ回答${out.skipped}件は飛ばしました）`);};
  reader.onerror=()=>toast('ファイルを読めませんでした。');
  reader.readAsText(file);return;}if(ev.target.name==='test-unit'){if(ev.target.checked)testUnits.add(ev.target.value);else testUnits.delete(ev.target.value);updateTestSummary();}if(ev.target.id==='test-level'){testLevel=ev.target.value;updateTestSummary();}if(ev.target.id==='test-count'){testCount=Number(ev.target.value);updateTestSummary();}});
document.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&ev.target.id==='answer'&&!ev.isComposing){ev.preventDefault();submitAnswer();}});
try{home();}catch(err){$('#app').innerHTML='<div class="error-screen"><h1>画面を読み込めませんでした</h1><p>ページを再読み込みしてください。記録は自動で削除しません。</p></div>';console.error(err);}
</script></body></html>

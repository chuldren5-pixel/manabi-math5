const groups=[{id:'number',name:'数と計算',color:'#e8f2ea',icon:'＋'},{id:'shape',name:'図形',color:'#fff0da',icon:'△'},{id:'relation',name:'変化と関係',color:'#e9effc',icon:'↗'},{id:'data',name:'データの活用',color:'#f3eafb',icon:'▥'}];
const units=[];const questions=[];
function unit(id,group,title,subtitle,code,points,example,steps,caution,visual){units.push({id,group,title,subtitle,code,points,example,steps,caution,visual});}
function q(unit,n,level,text,answer,steps,hint,options=null,suffix='',visual=null,check=null){questions.push({id:`m5-${unit}-${n}`,unit,level,text,answer:String(answer),steps,hint,options,suffix,visual,check});}
unit('place','number','整数と小数','位のしくみ・10倍と1/10','A(2)', ['整数も小数も、左の位へ一つ進むと10倍、右の位へ一つ進むと1/10になります。','10倍・100倍では各数字の位が左へ1けた・2けた移り、1/10・1/100では右へ移ります。'], '3.45を100倍すると？',['3.45の各数字を、2けた上の位へ移します。','3.45 × 100 = 345。小数点だけを見ず、数字の位で考えましょう。'],'0.001がいくつあるかを考えると、小数の大きさを確かめられます。','place');
q('place',1,'basic','3.45を10倍した数は？','34.5',['数字の位を左へ1けた移します。','3.45 × 10 = 34.5。'],'10倍で、位は左へ一つ。',null,'',null,{op:'mul',a:'3.45',b:'10'});
q('place',2,'basic','0.001を270個集めた数は？','0.27',['0.001を100個で0.1、200個で0.2です。','0.001 × 270 = 0.270 = 0.27。'],'0.001 × 270で考えよう。',null,'',null,{op:'mul',a:'0.001',b:'270'});
q('place',3,'standard','48.6を1/100にした数は？','0.486',['数字の位を右へ2けた移します。','48.6 ÷ 100 = 0.486。'],'100で割ります。',null,'',null,{op:'div',a:'48.6',b:'100'});
q('place',4,'standard','7.08の「8」は、どの位の数字？','1/100の位',['小数点の右は、1/10の位、1/100の位と続きます。','7.08の8は、小数点から右へ2けた目にあります。'],'小数点から数えよう。',['1/10の位','1/100の位','1/1000の位']);
q('place',5,'challenge','ある数を100倍すると52.3になりました。もとの数は？','0.523',['もとの数に戻すには、100で割ります。','52.3 ÷ 100 = 0.523。'],'100倍の逆を考えよう。',null,'',null,{op:'div',a:'52.3',b:'100'});
unit('multiply','number','小数のかけ算','計算の意味・筆算・計算の工夫','A(3)(6)',['小数どうしのかけ算は、整数のかけ算に置きかえて考えられます。','かける数が1より小さいと、積はかけられる数より小さくなります（正の数の場合）。'],'2.4 × 1.3は？',['24 × 13 = 312と計算します。','2.4と1.3をそれぞれ10倍したので、積を100で割ります。','312 ÷ 100 = 3.12。'],'先におよその大きさを考え、小数点の位置を確かめましょう。',null);
q('multiply',1,'basic','1.2 × 0.3は？','0.36',['12 × 3 = 36。','両方を10倍したので、36 ÷ 100 = 0.36。'],'小数点より右のけた数は、合わせて2けた。',null,'',null,{op:'mul',a:'1.2',b:'0.3'});
q('multiply',2,'basic','6 × 0.5の答えは、6と比べてどうなる？','小さくなる',['0.5は1より小さい数です。','6の半分なので、答えは3。6より小さくなります。'],'0.5は半分という大きさ。',['大きくなる','同じになる','小さくなる']);
q('multiply',3,'standard','2.4 × 1.3は？','3.12',['24 × 13 = 312。','積を100で割り、3.12になります。'],'24 × 13を利用します。',null,'',null,{op:'mul',a:'2.4',b:'1.3'});
q('multiply',4,'standard','0.25 × 8 × 4を工夫して計算すると？','8',['かける順序を変えても積は同じです。','(0.25 × 4) × 8 = 1 × 8 = 8。'],'0.25と4を先にかけてみよう。',null,'',null,{op:'mul3',args:['0.25','8','4']});
q('multiply',5,'challenge','1mあたり120円のリボンを2.5m買います。代金は？','300',['1mの代金に、買う長さをかけます。','120 × 2.5 = 300円。'],'1mあたりの代金 × 長さ。',null,'円',null,{op:'mul',a:'120',b:'2.5'});
q('multiply',6,'standard','3.6 × 2.5は？','9',['36 × 25 = 900。','積を100で割り、9になります。'],'36 × 25を利用します。',null,'',null,{op:'mul',a:'3.6',b:'2.5'});
q('multiply',7,'challenge','1Lで8.4km走る車があります。4.5Lでは何km走れる？','37.8',['1Lで走れる道のりに、使う量をかけます。','8.4 × 4.5 = 37.8km。'],'1Lあたり × 使う量。',null,'km',null,{op:'mul',a:'8.4',b:'4.5'});
unit('divide','number','小数のわり算','わる数を整数に・余り・概数','A(3)',['わられる数とわる数を同じ数だけ10倍・100倍しても、商は変わりません。','わる数を整数にして計算します。余りや単位は、もとの問題に戻して確かめましょう。'],'4.8 ÷ 0.6は？',['両方を10倍して、48 ÷ 6にします。','48 ÷ 6 = 8なので、答えは8です。'],'1より小さい数で割ると、商がもとの数より大きくなることがあります。',null);
q('divide',1,'basic','4.8 ÷ 0.6は？','8',['両方を10倍して、48 ÷ 6。','48 ÷ 6 = 8。'],'わる数0.6を整数にします。',null,'',null,{op:'div',a:'4.8',b:'0.6'});
q('divide',2,'basic','3 ÷ 0.5の答えは？','6',['0.5が3の中にいくつあるか考えます。','30 ÷ 5 = 6。'],'0.5が二つで1になります。',null,'',null,{op:'div',a:'3',b:'0.5'});
q('divide',3,'standard','7.56 ÷ 1.2は？','6.3',['両方を10倍して、75.6 ÷ 12。','75.6 ÷ 12 = 6.3。'],'両方を同じ10倍にしよう。',null,'',null,{op:'div',a:'7.56',b:'1.2'});
q('divide',4,'standard','5 ÷ 3の商を、小数第2位を四捨五入して小数第1位まで表すと？','1.7',['5 ÷ 3 = 1.666…です。','小数第2位の6を四捨五入するので、1.7。'],'小数第2位を見て、小数第1位を決めます。',null,'');
q('divide',5,'challenge','4.3mのひもから0.6mのひもを、できるだけ多く切り取ります。何本取れる？','7',['4.3 ÷ 0.6 = 7 あまり0.1。','8本では4.8m必要なので、7本取れます。'],'本数は整数。切り上げてよいか考えよう。',null,'本',null,{op:'floorDiv',a:'4.3',b:'0.6'});
q('divide',6,'standard','9.6 ÷ 2.4は？','4',['両方を10倍して、96 ÷ 24。','96 ÷ 24 = 4。'],'わる数を整数にします。',null,'',null,{op:'div',a:'9.6',b:'2.4'});
q('divide',7,'challenge','2.4Lのジュースを0.3Lずつコップに分けます。何杯分できる？','8',['2.4の中に0.3がいくつあるか考えます。','2.4 ÷ 0.3 = 8杯。'],'0.3をいくつ集めると2.4になるかな。',null,'杯',null,{op:'div',a:'2.4',b:'0.3'});
unit('integer','number','偶数・奇数、倍数・約数','整数の性質・公倍数と公約数','A(1)',['2で割り切れる整数が偶数、2で割ると1余る整数が奇数です。0も偶数です。','共通する倍数が公倍数、共通する約数が公約数です。最小公倍数と最大公約数を区別しましょう。'],'6と8の最小公倍数は？',['6の倍数は6、12、18、24…。','8の倍数は8、16、24…。','初めて共通する24が最小公倍数です。'],'約数は「割る数」、倍数は「かけてできる数」。',null);
q('integer',1,'basic','0は偶数と奇数のどちら？','偶数',['0 = 2 × 0です。','0は2で割り切れるので、偶数です。'],'2で割り切れるかを考えよう。',['偶数','奇数','どちらでもない']);
q('integer',2,'basic','6の倍数はどれ？','18',['6 × 3 = 18。','倍数は、その数に整数をかけてできます。'],'6の段を考えてみよう。',['16','18','20']);
q('integer',3,'standard','6と8の最小公倍数は？','24',['6の倍数：6、12、18、24。','8の倍数：8、16、24。最小の公倍数は24。'],'二つの倍数を小さい順に書こう。',null,'',null,{op:'lcm',a:6,b:8});
q('integer',4,'standard','18と24の最大公約数は？','6',['18の約数：1、2、3、6、9、18。','24の約数：1、2、3、4、6、8、12、24。共通する中で最大は6。'],'両方を割り切れる整数を探そう。',null,'',null,{op:'gcd',a:18,b:24});
q('integer',5,'challenge','赤い紙12枚と青い紙18枚を、余りなく、どの組も同じ色・枚数の組み合わせになるよう分けます。最大で何組できる？','6',['組数は12と18の両方を割り切る数になります。','12と18の最大公約数は6。1組は赤2枚・青3枚です。'],'最大公約数を使います。',null,'組',null,{op:'gcd',a:12,b:18});
q('integer',6,'standard','20の約数は全部でいくつ？','6',['20の約数は1、2、4、5、10、20です。','全部で6個あります。'],'1から順に、割り切れる数を探そう。',null,'個',null,{op:'identity',a:'6'});
q('integer',7,'challenge','3でも4でも割り切れる、いちばん小さい整数は？','12',['3の倍数：3、6、9、12。','4の倍数：4、8、12。最小の公倍数は12。'],'両方の倍数を書き出そう。',null,'',null,{op:'lcm',a:3,b:4});
unit('fraction','number','分数と小数・整数','分数の意味・約分・通分','A(4)',['a ÷ bの商は、分数a/bで表せます（bは0ではありません）。','分子と分母に同じ数をかけても、同じ数で割っても、大きさは変わりません。約分や通分に使います。'],'0.75を分数で表すと？',['0.75 = 75/100です。','分子と分母を25で割り、3/4になります。'],'分数の入力は「3/4」。帯分数は「1 1/2」でも入力できます。同じ大きさなら正解です。','fraction');
q('fraction',1,'basic','3 ÷ 4の商を分数で表すと？','3/4',['わられる数が分子、わる数が分母です。','3 ÷ 4 = 3/4。'],'a ÷ bはa/b。',null,'',null,{op:'div',a:'3',b:'4'});
q('fraction',2,'basic','0.75を分数で表すと？','3/4',['0.75 = 75/100。','25で約分すると3/4。'],'100分のいくつかを考えよう。',null,'',null,{op:'div',a:'75',b:'100'});
q('fraction',3,'standard','18/24と同じ大きさの分数はどれ？','3/4',['18と24を、共通の約数6で割ります。','18/24 = 3/4。'],'分子と分母を同じ数で割ります。',['3/4','2/3','3/8']);
q('fraction',4,'standard','2/3 = □/12。□に入る整数は？','8',['分母3を12にするには4倍します。','分子2も4倍して、8です。'],'分母も分子も同じ4倍。',null,'',null,{op:'mul',a:'2',b:'4'});
q('fraction',5,'challenge','2mのリボンを3人で同じ長さずつ分けます。1人分は何m？','2/3',['全体の長さ2mを3等分します。','2 ÷ 3 = 2/3m。'],'割り切れない商も、分数で表せます。',null,'m',null,{op:'div',a:'2',b:'3'});
unit('fraction-add','number','分数のたし算・ひき算','異分母・帯分数・小数との計算','A(5)',['分母が違うときは、通分して同じ分母にそろえます。','分母はそのままに、分子をたしたり引いたりします。最後に約分できるか確かめます。'],'1/3 ＋ 1/4は？',['分母を12にそろえ、4/12 + 3/12にします。','分子をたして、7/12。'],'分母どうしをたしません。分母は一つ分の大きさを表しています。','fraction');
q('fraction-add',1,'basic','1/2 ＋ 1/3は？','5/6',['通分すると3/6 + 2/6。','分子をたして5/6です。'],'分母を6にそろえます。',null,'',null,{op:'add',a:'1/2',b:'1/3'});
q('fraction-add',2,'basic','3/4 − 1/2は？','1/4',['1/2 = 2/4にします。','3/4 − 2/4 = 1/4。'],'1/2を何/4にできるかな。',null,'',null,{op:'sub',a:'3/4',b:'1/2'});
q('fraction-add',3,'standard','2/3 ＋ 5/6は？','3/2',['2/3 = 4/6。','4/6 + 5/6 = 9/6 = 3/2（1と1/2）。'],'分母を6にそろえ、最後に約分します。',null,'',null,{op:'add',a:'2/3',b:'5/6'});
q('fraction-add',4,'standard','1と1/4 − 2/3は？','7/12',['1と1/4 = 5/4 = 15/12。2/3 = 8/12。','15/12 − 8/12 = 7/12。'],'帯分数を仮分数に直してみよう。',null,'',null,{op:'sub',a:'5/4',b:'2/3'});
q('fraction-add',5,'challenge','0.5Lのジュースに1/3Lを足します。全部で何L？','5/6',['0.5 = 1/2なので、1/2 + 1/3を計算します。','3/6 + 2/6 = 5/6L。'],'小数を分数にそろえます。',null,'L',null,{op:'add',a:'0.5',b:'1/3'});
q('fraction-add',6,'standard','1/4 ＋ 2/3は？','11/12',['分母を12にそろえると、3/12 + 8/12。','分子をたして、11/12。'],'分母を12にそろえます。',null,'',null,{op:'add',a:'1/4',b:'2/3'});
q('fraction-add',7,'challenge','3/4Lの牛乳のうち、1/3L飲みました。残りは何L？','5/12',['3/4 = 9/12、1/3 = 4/12です。','9/12 − 4/12 = 5/12L。'],'通分してから引きます。',null,'L',null,{op:'sub',a:'3/4',b:'1/3'});
unit('volume','shape','直方体・立方体の体積','立体の大きさ・体積の単位','B(4)',['体積は、1辺1cmの立方体がいくつ分入るかで考えられます。単位はcm³です。','直方体の体積 = 縦 × 横 × 高さ。立方体は1辺 × 1辺 × 1辺。'],'縦3cm、横4cm、高さ5cmの直方体の体積は？',['底に1cm³の立方体が、3 × 4 = 12個並びます。','それが5段あるので、12 × 5 = 60cm³です。'],'1m³ = 1,000,000cm³。1L = 1,000cm³です。','cuboid');
q('volume',1,'basic','1辺3cmの立方体の体積は？','27',['立方体は、1辺 × 1辺 × 1辺。','3 × 3 × 3 = 27cm³。'],'3を三つかけます。',null,'cm³',null,{op:'mul3',args:['3','3','3']});
q('volume',2,'basic','1Lは何cm³？','1000',['1Lは1辺10cmの立方体の体積です。','10 × 10 × 10 = 1000cm³。'],'1辺10cmの立方体を考えよう。',null,'cm³',null,{op:'mul3',args:['10','10','10']});
q('volume',3,'standard','縦3cm、横4cm、高さ5cmの直方体の体積は？','60',['直方体は、縦 × 横 × 高さ。','3 × 4 × 5 = 60cm³。'],'底面に何個並び、何段あるかな。',null,'cm³','cuboid', {op:'mul3',args:['3','4','5']});
q('volume',4,'standard','縦5cm、横4cm、体積120cm³の直方体。高さは何cm？','6',['底面に1cm³の立方体が5 × 4 = 20個並びます。','120 ÷ 20 = 6cm。'],'体積を、縦 × 横で割ります。',null,'cm',null,{op:'div',a:'120',b:'20'});
q('volume',5,'challenge','縦10cm、横8cm、高さ5cmの直方体から、体積60cm³の直方体を切り取ります。残りの体積は？','340',['もとの体積は10 × 8 × 5 = 400cm³。','400 − 60 = 340cm³。'],'もとの体積から、切り取った体積を引きます。',null,'cm³',null,{op:'sub',a:'400',b:'60'});
q('volume',6,'standard','縦6cm、横5cm、高さ4cmの直方体の体積は？','120',['直方体は、縦 × 横 × 高さ。','6 × 5 × 4 = 120cm³。'],'底面に何個並び、何段あるかな。',null,'cm³',null,{op:'mul3',args:['6','5','4']});
q('volume',7,'challenge','体積が64cm³の立方体があります。1辺の長さは何cm？','4',['1辺 × 1辺 × 1辺 = 64になる数を探します。','4 × 4 × 4 = 64なので、1辺は4cmです。'],'同じ数を三つかけて64になる数。',null,'cm',null,{op:'identity',a:'4'});
unit('congruent','shape','合同な図形','重なり合う形・対応・作図','B(1)',['ぴったり重なる図形どうしを、合同といいます。向きや位置が違っても、裏返してもかまいません。','合同な図形では、対応する辺の長さと角の大きさがそれぞれ等しくなります。'],'合同な三角形ABCとDEFで、A↔D、B↔E、C↔F。辺ABに対応する辺は？',['辺の両端の頂点を、一つずつ対応させます。','AはD、BはEなので、辺DEです。'],'見た目の位置で決めず、対応する頂点を確認しましょう。','congruent');
q('congruent',1,'basic','同じ形・同じ大きさの図形を回転させました。もとの図形と合同？','合同である',['回転しても形や大きさは変わりません。','ぴったり重ねられるので、合同です。'],'向きが違っても重なるかな。',['合同である','合同ではない','回転すると必ず大きくなる']);
q('congruent',2,'basic','合同な図形について正しいのは？','対応する辺の長さが等しい',['合同な図形は、ぴったり重なります。','対応する辺の長さも、角の大きさもそれぞれ等しくなります。'],'ぴったり重ねたときを想像しよう。',['対応する辺の長さが等しい','面積だけ等しければ必ず合同','向きが違うと合同ではない']);
q('congruent',3,'standard','合同な三角形ABCとDEFで、A↔D、B↔E、C↔F。辺BCに対応する辺は？','辺EF',['Bに対応するのはE、Cに対応するのはF。','辺BCには辺EFが対応します。'],'BとC、それぞれの相手は？',['辺DE','辺EF','辺DF']);
q('congruent',4,'standard','合同な二つの図形で、ある辺の長さは6.5cmです。それに対応する辺の長さは何cm？','6.5',['合同な図形の対応する辺は、同じ長さです。','したがって6.5cmです。'],'対応する辺は等しい。',null,'cm',null,{op:'identity',a:'6.5'});

/* Explains why an input is not a number. Returns '' when the input is a valid number. */
function diagnose(raw,q){

 if((s.match(/\//g)||[]).length>1)return '分数の「/」は1つだけ使います。';
 if((s.match(/\./g)||[]).length>1)return '小数点は1つだけ使います。';
 if(/\d\s*[+＋×xX*÷−\-]\s*\d/.test(s))return '式ではなく、計算した答えの数を入力しましょう。';

function shuffled(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b;}

/* ---------- questions, including generated similar questions (類題) ---------- */
const variantCache=new Map();
const VARIANT_RE=/^(m5-[a-z-]+-\d+)~g(\d+)-(\d{1,9})$/;
function variantOf(id){
 if(variantCache.has(id))return variantCache.get(id);
 const m=VARIANT_RE.exec(String(id));if(!m||!byId.has(m[1])||typeof MathContent.makeVariant!=='function')return null;
 let v=null;try{v=MathContent.makeVariant(m[1],Number(m[3]),Number(m[2]));}catch(e){v=null;}
 if(v&&v.id!==id)v=null;
 if(v)variantCache.set(id,v);return v;
}
function getQ(id){return byId.get(id)||variantOf(id)||null;}
function hasVariant(baseId){return !!(MathContent.variants&&MathContent.variants[baseId]);}
function newVariantId(baseId){if(!hasVariant(baseId))return null;const gen=MathContent.variants[baseId].gen;for(let i=0;i<20;i++){const id=`${baseId}~g${gen}-${1+Math.floor(Math.random()*999999998)}`;if(getQ(id))return id;}return null;}
function baseOf(a){if(!a)return null;if(byId.has(a.id))return a.id;return typeof a.base==='string'&&byId.has(a.base)?a.base:null;}
/* The question shown for a stored answer. Similar questions keep a text snapshot so a record never shows a different question. */
function attemptQuestion(a){
 if(byId.has(a.id))return byId.get(a.id);
 const live=variantOf(a.id),base=byId.get(baseOf(a));if(!base)return null;
 return {...(live||{steps:[],options:null,visual:null,hint:'',think:''}),id:a.id,base:base.id,unit:base.unit,level:base.level,variant:true,
  text:typeof a.qtext==='string'?a.qtext:(live?live.text:'類題'),answer:typeof a.qanswer==='string'?a.qanswer:(live?live.answer:''),suffix:typeof a.qsuffix==='string'?a.qsuffix:(live?live.suffix:base.suffix)};
}
const hintLevelOf=a=>Number.isInteger(a?.hintLevel)?Math.max(0,Math.min(3,a.hintLevel)):(a?.hint?1:0);
/* An answer settles a question only when it is correct and was not given right after reading the explanation. */
const settles=a=>!!(a&&a.ok&&!a.explained);
function kindOf(a){if(!a.ok)return 'wrong';if(a.explained)return 'explained';return hintLevelOf(a)>0?'hinted':'solo';}

/* ---------- state ---------- */
const fresh=()=>({version:2,schema:SCHEMA,attempts:[],notes:{},active:null,lastResult:null,lastUnit:units[0].id,settings:{size:5,keypad:true,companion:MathContent.companions[0].id,outfit:'none'}});
let state=fresh(),storageOk=true,storageMessage='',migrated=false;
function cleanResponse(a){
 if(!a||typeof a.ok!=='boolean'||typeof a.answer!=='string'||typeof a.id!=='string')return null;
 if(!byId.has(a.id)&&!(baseOf(a)&&(variantOf(a.id)||typeof a.qtext==='string')))return null;
 const out={...a};
 if(a.hintLevel!==undefined)out.hintLevel=hintLevelOf(a);
 for(const k of ['explained','retry'])if(k in out)out[k]=!!out[k];
 if('again' in out){if(out.again&&typeof out.again.answer==='string'&&typeof out.again.ok==='boolean')out.again={answer:out.again.answer,ok:out.again.ok};else delete out.again;}
 return out;
}
const validResponse=a=>!!cleanResponse(a);
function restoreSession(s){
 if(!s||!MODES.includes(s.mode)||!Array.isArray(s.ids)||!s.ids.length||s.ids.some(id=>!getQ(id))||new Set(s.ids).size!==s.ids.length)return null;
 if(!Number.isInteger(s.cursor)||s.cursor<0||s.cursor>=s.ids.length||!['answer','feedback','retry'].includes(s.phase))return null;
 if(!Array.isArray(s.responses)||!s.responses.every(validResponse)||s.responses.length!==s.cursor+(s.phase==='answer'?0:1)||s.responses.some((a,i)=>a.id!==s.ids[i]))return null;
 if(s.mode==='test'&&s.phase!=='answer')return null;
 const q=getQ(s.ids[s.cursor]);if(typeof s.draft!=='string')s.draft='';
 const order=s.order;if(q.options&&(!Array.isArray(order)||order.length!==q.options.length||new Set(order).size!==q.options.length||order.some(o=>!q.options.includes(o))))s.order=shuffled(q.options);
 const hintLevel=s.mode==='test'?0:hintLevelOf(s);
 const mission=MathContent.missions.some(m=>m.id===s.mission)?s.mission:null;
 return {...s,mission,responses:s.responses.map(cleanResponse),label:typeof s.label==='string'?s.label:'学習の続き',note:typeof s.note==='string'?s.note:'',hintLevel,hint:hintLevel>0};
}
try{
 const raw=localStorage.getItem(KEY);
 if(raw){
  let v;try{v=JSON.parse(raw);}catch(e){v=null;}
  if(!v||v.version!==2||!Array.isArray(v.attempts)){
   // Keep an untouched copy before anything can overwrite it.
   try{if(localStorage.getItem(UNREADABLE_KEY)===null)localStorage.setItem(UNREADABLE_KEY,raw);}catch(e){}
   throw Error('invalid');
  }
  if(v.schema!==SCHEMA){migrated=true;if(localStorage.getItem(BACKUP_KEY)===null)localStorage.setItem(BACKUP_KEY,raw);}
  state.attempts=v.attempts.filter(a=>Number.isFinite(Date.parse(a?.time))&&MODES.includes(a?.mode)).map(cleanResponse).filter(Boolean);
  if(v.notes&&typeof v.notes==='object'&&!Array.isArray(v.notes))for(const [id,n] of Object.entries(v.notes))if(byId.has(id)&&typeof n==='string')state.notes[id]=n.slice(0,2000);
  state.active=restoreSession(v.active);state.lastUnit=units.some(u=>u.id===v.lastUnit)?v.lastUnit:units[0].id;
  if(v.lastResult&&Array.isArray(v.lastResult.responses)&&v.lastResult.responses.every(validResponse))state.lastResult={...v.lastResult,mission:MathContent.missions.some(m=>m.id===v.lastResult.mission)?v.lastResult.mission:null,responses:v.lastResult.responses.map(cleanResponse)};
  if(v.settings&&typeof v.settings==='object'){if([3,5].includes(v.settings.size))state.settings.size=v.settings.size;if(typeof v.settings.keypad==='boolean')state.settings.keypad=v.settings.keypad;
   if(MathContent.companions.some(c=>c.id===v.settings.companion))state.settings.companion=v.settings.companion;
   if(MathContent.outfits.some(o=>o.id===v.settings.outfit))state.settings.outfit=v.settings.outfit;}
 }
 // Check whether persistence is actually allowed, without touching other app data.
 localStorage.setItem(KEY,JSON.stringify(state));
}catch(e){storageOk=false;storageMessage='この端末では学習記録を保存できません。いまの記録はこの画面の中だけにあります。閉じる前に「記録」画面でバックアップを保存してください。';}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state));storageOk=true;storageMessage='';}catch(e){storageOk=false;storageMessage='学習記録を保存できません。閉じる前に「記録」画面でバックアップを保存してください。保存しないと、今回の記録は消えます。';}}

/* ---------- progress ---------- */
// Latest answer per base question. Answers to similar questions count for their base question.
function latest(){const map=new Map();for(const a of state.attempts){const b=baseOf(a);if(b)map.set(b,a);}return map;}
function wrong(){return [...latest()].filter(([,a])=>!settles(a)).map(([b])=>byId.get(b));}
function statusOf(baseId,map=latest()){const a=map.get(baseId);if(!a)return 'new';return kindOf(a);}
function unitStats(id){
 const qs=questions.filter(q=>q.unit===id),map=latest(),firsts=new Map(),variantSolo=new Set();
 for(const a of state.attempts){const b=baseOf(a);if(!b)continue;if(a.id===b&&!firsts.has(b))firsts.set(b,a);if(a.id!==b&&kindOf(a)==='solo')variantSolo.add(b);}
 const count=k=>qs.filter(q=>map.has(q.id)&&kindOf(map.get(q.id))===k).length;
 return {answered:qs.filter(q=>map.has(q.id)).length,correct:qs.filter(q=>settles(map.get(q.id))).length,total:qs.length,
  wrong:qs.filter(q=>map.has(q.id)&&!settles(map.get(q.id))).length,
  solo:count('solo'),hinted:count('hinted'),explained:count('explained'),missed:count('wrong'),
  firstSolo:qs.filter(q=>firsts.has(q.id)&&kindOf(firsts.get(q.id))==='solo').length,
  variantSolo:qs.filter(q=>variantSolo.has(q.id)).length,variantReady:qs.filter(q=>hasVariant(q.id)).length};
}
const unitWeight=id=>{const u=units.find(u=>u.id===id);return u&&u.weight>0?u.weight:1;};
/* Units are ordered at random, but a unit school spends more time on is more likely to come first.
   When a test asks for fewer questions than there are units, the units near the front are the ones that appear. */
function weightedOrder(ids){
 const pool=ids.map(id=>({id,w:unitWeight(id)})),out=[];
 while(pool.length){
  let total=pool.reduce((s,x)=>s+x.w,0),r=Math.random()*total,i=0;
  for(;i<pool.length-1;i++){r-=pool[i].w;if(r<=0)break;}
  out.push(pool.splice(i,1)[0].id);
 }
 return out;
}
/* What a question can earn, and what it cannot.
   done    : answered correctly with no hint and not straight after the explanation.
             For a multiple-choice question only the FIRST try counts, so working through the options earns nothing.
             For a question you type a number into, a later unaided correct answer counts too — a number cannot be guessed.
   checked : the same, on a question with different numbers (a 類題), which is the evidence the idea carried over.
   Each question can earn each mark once, ever. Repeating an easy unit earns nothing extra.
   Nothing is earned for speed, for the number of questions shown, or for a correct answer straight after reading the explanation. */
function achievements(){
 const firstById=new Map();
 for(const a of state.attempts)if(!firstById.has(a.id))firstById.set(a.id,a);

 for(const q of questions)marks.set(q.id,{done:false,checked:false,canCheck:hasVariant(q.id)});
 for(const a of state.attempts){
  const base=baseOf(a),mark=base&&marks.get(base);
  if(!mark||kindOf(a)!=='solo')continue;
  const q=attemptQuestion(a);
  if(q&&q.options&&firstById.get(a.id)!==a)continue; // a choice counts on the first try only
  if(a.id===base)mark.done=true;else mark.checked=true;

 const list=[...marks.values()];
 const totals={done:list.filter(m=>m.done).length,checked:list.filter(m=>m.checked).length,
  possibleDone:questions.length,possibleChecked:list.filter(m=>m.canCheck).length};
 const unitInfo={};
 for(const u of units){
  const qs=questions.filter(q=>q.unit===u.id).map(q=>marks.get(q.id));
  unitInfo[u.id]={done:qs.filter(m=>m.done).length,checked:qs.filter(m=>m.checked).length,total:qs.length,
   complete:qs.every(m=>m.done),mastered:qs.every(m=>m.done&&(m.checked||!m.canCheck))};

function prepared(qs,count,balanced=false){
 if(!balanced)return shuffled(qs).slice(0,count);

 for(const q of qs){if(!pools.has(q.unit))pools.set(q.unit,[]);pools.get(q.unit).push(q);}
 for(const [id,list] of pools)pools.set(id,shuffled(list));

 // First one question per selected unit, so none is skipped. With less room than units, the heavier ones come first.
 for(const id of ids){if(left<=0)break;take.set(id,1);left--;}
 // Everything beyond that goes by weight, so a unit school spends more time on gets more questions.
 while(left>0){
  const open=ids.filter(id=>take.get(id)<pools.get(id).length);
  if(!open.length)break;
  const picked=weightedOrder(open)[0];take.set(picked,take.get(picked)+1);left--;
 }
 let result=[];
 for(const id of ids)result.push(...pools.get(id).slice(0,take.get(id)));

}

/* ---------- sessions ---------- */
function begin(ids,mode,label){
 const qs=[...new Set(ids)].filter(id=>getQ(id));if(!qs.length||!MODES.includes(mode))return false;
 state.active={run:gid(),ids:qs,mode,label,mission:null,cursor:0,phase:'answer',responses:[],draft:'',note:'',hint:false,hintLevel:0,order:null};prepareCurrent();persist();return true;
}
function prepareCurrent(){const s=state.active,q=getQ(s.ids[s.cursor]);s.order=q.options?shuffled(q.options):null;s.note=state.notes[q.base||q.id]||'';state.lastUnit=q.unit;}
function current(){const s=state.active;return s?getQ(s.ids[s.cursor]):null;}
function setDraft(v){if(state.active&&['answer','retry'].includes(state.active.phase)){state.active.draft=String(v).slice(0,80);persist();}}
function setNote(v){if(state.active){state.active.note=String(v).slice(0,2000);persist();}}
/* Hints go one step at a time: 1 = what to look at, 2 = a step on the way, 3 = the full explanation. */
function showHint(){const s=state.active;if(!s||s.mode==='test'||s.phase!=='answer')return 0;s.hintLevel=Math.min(3,hintLevelOf(s)+1);s.hint=true;persist();return s.hintLevel;}
function hintText(q,level){if(!q)return '';if(level===1)return q.hint;if(level===2)return q.think||q.steps[0];return '';}
function snapshot(q){return q.base?{base:q.base,qtext:q.text,qanswer:q.answer,qsuffix:q.suffix||''}:{};}
function recordResponses(responses,mode){const time=new Date().toISOString(),run=state.active?state.active.run:'';for(const r of responses){const {again,...rest}=r;state.attempts.push({...rest,mode,time,run});}}
function finish(){const s=state.active;if(s.mode==='test')recordResponses(s.responses,'test');state.lastResult={run:s.run,label:s.label,mode:s.mode,mission:s.mission||null,responses:s.responses,time:new Date().toISOString()};state.active=null;persist();}
function check(q,answer){return q.options?answer===q.answer:equal(answer,q.answer);}
function submit(){
 const s=state.active;if(!s||!['answer','retry'].includes(s.phase))return {error:'この問題には回答済みです。'};
 const q=getQ(s.ids[s.cursor]),answer=normal(s.draft);
 if(!answer)return {error:q.options?'答えを一つ選んでください。':'答えを入力してください。'};
 if(q.options&&!q.options.includes(answer))return {error:'答えを一つ選んでください。'};
 if(!q.options){const why=diagnose(answer,q);if(why)return {error:why};}
 const ok=check(q,answer),noteKey=q.base||q.id;
 if(s.note.trim())state.notes[noteKey]=s.note.trim();else delete state.notes[noteKey];
 if(s.phase==='retry'){
  // A second try right after reading the explanation: kept, but never counted as solving it alone.
  const first=s.responses[s.cursor];first.again={answer,ok};
  recordResponses([{id:q.id,answer,ok,hint:first.hint,hintLevel:hintLevelOf(first),explained:true,retry:true,...snapshot(q)}],s.mode);
  s.phase='feedback';persist();return {feedback:true,retry:true};
 }
 const hintLevel=s.mode==='test'?0:hintLevelOf(s);
 const response={id:q.id,answer,ok,hint:hintLevel>0,hintLevel,explained:hintLevel>=3,...snapshot(q)};s.responses.push(response);
 if(s.mode==='test'){if(s.cursor===s.ids.length-1){finish();return {done:true}}s.cursor++;s.draft='';s.note='';s.hint=false;s.hintLevel=0;prepareCurrent();persist();return {next:true};}

}
function canRetry(){const s=state.active;if(!s||s.mode==='test'||s.phase!=='feedback')return false;const r=s.responses[s.cursor];return !!r&&!r.ok&&!r.again;}
function retry(){if(!canRetry())return false;const s=state.active,q=current();s.phase='retry';s.draft='';s.order=q.options?shuffled(q.options):null;persist();return true;}
function insertNext(id){
 const s=state.active;if(!s||s.mode==='test'||s.phase!=='feedback'||!getQ(id)||s.ids.includes(id))return false;
 s.ids.splice(s.cursor+1,0,id);persist();return true;
}
function insertVariant(){const q=current();if(!q)return null;const id=newVariantId(q.base||q.id);return id&&insertNext(id)?id:null;}
/* A basic question of the same unit to step back to, preferring ones not yet settled. */
function basicFor(){
 const s=state.active,q=current();if(!s||!q||q.level==='basic')return null;
 const map=latest(),pool=questions.filter(x=>x.unit===q.unit&&x.level==='basic'&&!s.ids.includes(x.id));
 return pool.find(x=>map.has(x.id)&&!settles(map.get(x.id)))||pool.find(x=>!map.has(x.id))||pool[0]||null;
}
function next(){const s=state.active;if(!s||s.phase!=='feedback')return false;if(s.cursor===s.ids.length-1){finish();return true;}s.cursor++;s.phase='answer';s.draft='';s.note='';s.hint=false;s.hintLevel=0;prepareCurrent();persist();return false;}
/* Stop a practice or review early. Answers already given stay recorded; nothing unanswered is counted. */
function endEarly(){
 const s=state.active;if(!s||s.mode==='test')return false;
 if(!s.responses.length){state.active=null;persist();return 'empty';}
 s.ids=s.ids.slice(0,s.responses.length);s.cursor=s.ids.length-1;s.phase='feedback';finish();return 'done';
}
/* Which outfits are open. An outfit opens on marks, which are capped per question, so nothing here can be farmed. */
function outfitsOpen(){
 const a=achievements(),earned=a.totals.done+a.totals.checked,full=Object.values(a.units).filter(u=>u.complete).length;
 return MathContent.outfits.map(o=>({...o,open:(o.need===undefined||earned>=o.need)&&(o.needUnits===undefined||full>=o.needUnits),
  progress:o.needUnits!==undefined?{have:full,want:o.needUnits,what:'units'}:{have:earned,want:o.need,what:'marks'}}));
}
function setSetting(key,value){
 if(key==='size'&&[3,5].includes(value))state.settings.size=value;
 else if(key==='keypad'&&typeof value==='boolean')state.settings.keypad=value;
 else if(key==='companion'&&MathContent.companions.some(c=>c.id===value))state.settings.companion=value;
 else if(key==='outfit'){const o=outfitsOpen().find(o=>o.id===value);if(!o||!o.open)return false;state.settings.outfit=value;}
 else return false;
 persist();return true;}
/* A mission is a normal practice run on that unit's own questions. It grants nothing by itself. */
function beginMission(id){
 const m=MathContent.missions.find(m=>m.id===id);if(!m)return false;
 const ids=practiceFor(m.unit).map(q=>q.id).slice(0,m.count);
 if(ids.length<m.count||!begin(ids,'practice',m.title))return false;
 state.active.mission=m.id;persist();return true;
}
function missionProgress(){
 const s=state.active;if(!s||!s.mission)return null;
 const m=MathContent.missions.find(m=>m.id===s.mission);
 return {mission:m,cleared:s.responses.filter(r=>r.ok).length,answered:s.responses.length,total:s.ids.length};
}
/* Saving and restoring the records. Nothing is sent anywhere: both of these only build text,
   which the page then hands to the browser as a file. Importing merges and never deletes. */
const KIND_NAME={solo:'自力で正解',hinted:'ヒントを使って正解',explained:'解き方を読んで正解',wrong:'要復習'};
const LEVEL_NAME={basic:'基礎',standard:'標準',challenge:'活用'};
const MODE_NAME={practice:'練習',review:'復習',test:'確認テスト'};
function exportState(){return JSON.stringify({...state,app:'manabi-math5',exportedAt:new Date().toISOString()},null,1);}
function exportCsv(){
 const q1=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
 const head=['日時','取り組み','単元','レベル','問題','あなたの回答','正しい答え','結果','見たヒント(0-3)','類題か'];
 const rows=state.attempts.map(a=>{
  const q=attemptQuestion(a),u=q&&units.find(u=>u.id===q.unit);
  return [new Date(a.time).toLocaleString('ja-JP',{timeZone:'Asia/Tokyo'}),MODE_NAME[a.mode]||a.mode,u?u.title:'',
   q?LEVEL_NAME[q.level]||q.level:'',q?q.text:'',a.answer,q?q.answer:'',KIND_NAME[kindOf(a)],hintLevelOf(a),q&&q.variant?'類題':'もとの問題'].map(q1).join(',');
 });
 return '\ufeff'+[head.map(q1).join(','),...rows].join('\r\n')+'\r\n';
}
function importData(text){
 let v;try{v=JSON.parse(String(text));}catch(e){return {error:'ファイルを読めませんでした。このアプリで保存したバックアップを選んでください。'};}
 if(!v||v.version!==2||!Array.isArray(v.attempts))return {error:'このアプリのバックアップではないようです。記録は変えていません。'};
